<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="TechPulse — Independent technology and gaming news discovery portal" />
<meta name="theme-color" content="#0b1220" />
<title>TechPulse — Technology &amp; Gaming News</title>
<style>
  :root{
    --bg:#0b1220; --bg-2:#0f1a2e; --panel:#131f36; --panel-2:#0f1a2e;
    --border:#22304a; --text:#eaf0fb; --muted:#8a97b3; --accent:#3b82f6;
    --accent-2:#22d3ee; --tag-ai:#8b5cf6; --tag-cyber:#ef4444; --tag-cloud:#0ea5e9;
    --good:#22c55e; --radius:14px; --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  [data-theme="light"]{
    --bg:#f4f6fb; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f4f6fb;
    --border:#e1e6f0; --text:#101828; --muted:#5c6b85;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); transition:background 160ms ease, color 160ms ease; }
  a { color:inherit; text-decoration:none; }
  img { max-width:100%; display:block; }

  header.site-header {
    position:sticky; top:0; z-index:20; background:var(--bg-2cc, var(--bg-2));
    background:color-mix(in srgb, var(--bg-2) 88%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
  }
  .header-inner { max-width:1180px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; margin-right:auto; }
  .brand .mark { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#04101f; flex-shrink:0; }
  .brand .names { line-height:1.15; }
  .brand .names .n1 { font-weight:800; font-size:17px; }
  .brand .names .n2 { font-size:11px; color:var(--muted); font-family:var(--mono); letter-spacing:.04em; text-transform:uppercase; }

  nav.cat-tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .cat-tab { padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:13.5px; font-weight:600; cursor:pointer; }
  .cat-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  .header-tools { display:flex; align-items:center; gap:8px; }
  .search-box { display:flex; align-items:center; background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:6px 12px; gap:6px; }
  .search-box input { background:transparent; border:none; outline:none; color:var(--text); font-size:13.5px; width:140px; }
  .icon-btn { width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }

  main { max-width:1180px; margin:0 auto; padding:22px 20px 70px; }

  .status-line { display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-bottom:18px; flex-wrap:wrap; }
  .status-dot { width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .status-line button { background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:4px 10px; font-family:var(--mono); font-size:11px; cursor:pointer; }
  .status-line button:hover { color:var(--text); border-color:var(--accent); }

  section.hero { margin-bottom:34px; }
  h2.section-title { font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 14px 0; font-weight:800; }

  .hero-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:16px; }
  @media (max-width:820px){ .hero-grid { grid-template-columns:1fr; } }

  .story-card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; transition:transform 140ms ease, border-color 140ms ease; }
  .story-card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .story-card .thumb { width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--panel-2); }
  .story-card .thumb.placeholder { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; font-family:var(--mono); }
  .story-card .body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .story-card.featured .body { padding:20px 22px 22px; }
  .story-card.featured .headline { font-size:22px; }

  .tag-row { display:flex; gap:6px; flex-wrap:wrap; }
  .tag { font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:999px; font-weight:700; background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
  .tag.cat-Technology { background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
  .tag.cat-Gaming { background:color-mix(in srgb, var(--accent-2) 18%, transparent); color:var(--accent-2); }
  .tag.tag-AI { background:color-mix(in srgb, var(--tag-ai) 18%, transparent); color:var(--tag-ai); }
  .tag.tag-Cybersecurity { background:color-mix(in srgb, var(--tag-cyber) 16%, transparent); color:var(--tag-cyber); }
  .tag.trending { background:#fbbf2422; color:#f59e0b; }

  .headline { font-size:15.5px; font-weight:700; line-height:1.35; margin:0; }
  .excerpt { font-size:13px; color:var(--muted); line-height:1.5; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta-row { display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px; font-size:12px; color:var(--muted); }
  .meta-row .src { font-weight:700; color:var(--text); }
  .read-link { font-size:12.5px; font-weight:700; color:var(--accent); }

  .side-list { display:flex; flex-direction:column; gap:12px; }
  .side-list .story-card { flex-direction:row; align-items:stretch; }
  .side-list .story-card .thumb { width:96px; aspect-ratio:auto; flex-shrink:0; }
  .side-list .story-card .body { padding:10px 14px; gap:5px; }
  .side-list .headline { font-size:13.5px; }

  .card-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; }

  .empty-state, .error-state { text-align:center; padding:50px 20px; color:var(--muted); }
  .error-state { color:#f87171; }

  footer { border-top:1px solid var(--border); margin-top:50px; padding:24px 20px; text-align:center; color:var(--muted); font-size:12.5px; }
  footer .fbrand { font-weight:800; color:var(--text); margin-bottom:4px; }

  .skeleton { background:linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 37%, var(--panel) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:var(--radius); min-height:120px; }
  @keyframes sk { 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
</style>
</head>
<body data-theme="dark">

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="mark">TP</div>
      <div class="names">
        <div class="n1">TechPulse</div>
        <div class="n2">Technology &amp; Gaming News</div>
      </div>
    </div>
    <nav class="cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="All">All</button>
      <button class="cat-tab" data-cat="Technology">Technology</button>
      <button class="cat-tab" data-cat="Gaming">Gaming</button>
    </nav>
    <div class="header-tools">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search stories..." />
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☾</button>
    </div>
  </div>
</header>

<main>
  <div class="status-line" id="statusLine">
    <span class="status-dot"></span>
    <span id="statusText">Loading latest news...</span>
    <button id="refreshBtn">↻ Refresh</button>
  </div>

  <section class="hero" id="heroSection"></section>

  <section id="techSection">
    <h2 class="section-title">Latest Technology</h2>
    <div class="card-grid" id="techGrid"></div>
  </section>

  <section id="gamingSection" style="margin-top:34px;">
    <h2 class="section-title">Latest Gaming</h2>
    <div class="card-grid" id="gamingGrid"></div>
  </section>

  <section id="searchSection" style="display:none; margin-top:34px;">
    <h2 class="section-title">Search Results</h2>
    <div class="card-grid" id="searchGrid"></div>
  </section>
</main>

<footer>
  <div class="fbrand">TechPulse</div>
  <div>Independent technology and gaming news discovery.</div>
  <div>Headlines and excerpts are shown for discovery, with links to the original publisher.</div>
</footer>

<script src="app.js"></script>
</body>
</html>
