name: Update Technology & Gaming News



on:



  schedule:

    - cron: "*/15 * * * *"



  workflow_dispatch:



  push:

    paths:

      - "scripts/fetch_news.py"

      - "requirements.txt"

      - ".github/workflows/update-news.yml"



permissions:

  contents: write



concurrency:

  group: techpulse-news-update

  cancel-in-progress: true



jobs:



  update-news:



    runs-on: ubuntu-latest



    steps:



      # =====================================================

      # 1. CHECKOUT

      # =====================================================



      - name: Checkout repository

        uses: actions/checkout@v5

        with:

          fetch-depth: 1





      # =====================================================

      # 2. SETUP PYTHON

      # =====================================================



      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"

          cache: "pip"





      # =====================================================

      # 3. PYTHON VERSION

      # =====================================================



      - name: Show Python version

        run: |

          python --version

          pip --version





      # =====================================================

      # 4. INSTALL DEPENDENCIES

      # =====================================================



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt





      # =====================================================

      # 5. VERIFY DEPENDENCIES

      # =====================================================



      - name: Verify dependencies

        run: |

          python - <<'PY'

          import feedparser

          import requests

          import bs4



          print("feedparser:", feedparser.__version__)

          print("requests:", requests.__version__)

          print("BeautifulSoup: OK")

          print("All dependencies loaded successfully.")

          PY





      # =====================================================

      # 6. VERIFY FETCHER

      # =====================================================



      - name: Verify fetcher

        run: |

          test -f scripts/fetch_news.py

          echo "fetch_news.py found."





      # =====================================================

      # 7. RUN FETCHER

      # =====================================================



      - name: Fetch latest news

        run: |

          python -u scripts/fetch_news.py





      # =====================================================

      # 8. VALIDATE JSON

      # =====================================================



      - name: Validate news.json

        run: |



          test -f news.json



          python - <<'PY'



          import json

          from datetime import datetime



          with open(

              "news.json",

              "r",

              encoding="utf-8"

          ) as f:



              data = json.load(f)



          assert data.get("success") is True



          articles = data.get("articles")



          assert isinstance(

              articles,

              list

          )



          assert len(articles) > 0



          required = [

              "id",

              "title",

              "description",

              "url",

              "category",

              "mainCategory",

              "source",

              "published"

          ]



          for index, article in enumerate(

              articles

          ):



              for field in required:



                  assert field in article, (

                      f"Article {index} missing {field}"

                  )



              assert article["url"].startswith(

                  ("http://", "https://")

              )



              assert article["title"].strip()



              assert article["source"].strip()



          print("JSON validation successful.")

          print("Updated:", data.get("updatedAt"))

          print("Total:", data.get("total"))

          print("Technology:", data.get("technologyCount"))

          print("Gaming:", data.get("gamingCount"))



          PY





      # =====================================================

      # 9. SHOW STATUS

      # =====================================================



      - name: Show generated news status

        run: |



          echo "Git status:"

          git status --short



          echo ""

          echo "news.json:"

          ls -lh news.json





      # =====================================================

      # 10. COMMIT ONLY NEWS JSON

      # =====================================================



      - name: Commit updated news

        run: |



          git config user.name \

            "TechPulse News Bot"



          git config user.email \

            "41898282+github-actions[bot]@users.noreply.github.com"



          git add news.json



          if git diff --cached --quiet; then



            echo "No changes detected."



          else



            git commit \

              -m "Update latest technology and gaming news"



            git push



          fi
