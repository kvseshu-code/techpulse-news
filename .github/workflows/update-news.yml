name: Update Technology & Gaming News

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_news.py"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: techpulse-news-update
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show Python version
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: |
          python - <<'PY'
          import feedparser
          import requests
          import bs4

          print("feedparser:", feedparser.__version__)
          print("requests:", requests.__version__)
          print("BeautifulSoup: OK")
          print("All dependencies loaded successfully.")
          PY

      - name: Verify fetcher
        run: |
          test -f scripts/fetch_news.py
          echo "fetch_news.py found."

      - name: Fetch latest news
        run: |
          python -u scripts/fetch_news.py

      - name: Validate news.json
        run: |
          test -f news.json
          python - <<'PY'
          import json
          from datetime import datetime

          with open("news.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          assert data.get("success") is True, "JSON missing success=true"
          articles = data.get("articles")
          assert isinstance(articles, list), "articles is not a list"
          assert len(articles) > 0, "articles list is empty"

          required = [
              "id",
              "title",
              "description",
              "url",
              "category",
              "mainCategory",
              "source",
              "published"
          ]

          for index, article in enumerate(articles):
              for field in required:
                  assert field in article, f"Article {index} missing {field}"
              assert article["url"].startswith(("http://", "https://")), f"Invalid URL at index {index}"
              assert article["title"].strip(), f"Empty title at index {index}"
              assert article["source"].strip(), f"Empty source at index {index}"

          print("JSON validation successful.")
          print("Updated:", data.get("updatedAt"))
          print("Total:", data.get("total"))
          print("Technology:", data.get("technologyCount"))
          print("Gaming:", data.get("gamingCount"))
          PY

      - name: Show generated news status
        run: |
          echo "Git status:"
          git status --short
          echo ""
          echo "news.json:"
          ls -lh news.json

      - name: Commit updated news
        run: |
          git config user.name "TechPulse News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update latest technology and gaming news"
            git push
          fi
