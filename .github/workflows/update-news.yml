name: Update Technology & Gaming News

on:

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/fetch_news.py"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: techpulse-news-update
  cancel-in-progress: true

jobs:

  update-news:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # =====================================================
      # PYTHON VERSION
      # =====================================================

      - name: Show Python version
        run: |
          python --version
          python -m pip --version


      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # =====================================================
      # VERIFY DEPENDENCIES
      # =====================================================

      - name: Verify dependencies
        run: |
          python - <<'PY'
          import feedparser
          import requests
          import bs4

          print("feedparser:", getattr(feedparser, "__version__", "installed"))
          print("requests:", requests.__version__)
          print("BeautifulSoup: OK")
          print("All dependencies loaded successfully.")
          PY


      # =====================================================
      # VERIFY SCRIPT
      # =====================================================

      - name: Verify fetch script
        run: |
          test -f scripts/fetch_news.py
          python -m py_compile scripts/fetch_news.py
          echo "fetch_news.py syntax check passed."


      # =====================================================
      # RUN NEWS FETCHER
      # =====================================================

      - name: Fetch latest news
        run: |
          python -u scripts/fetch_news.py


      # =====================================================
      # VALIDATE NEWS JSON
      # =====================================================

      - name: Validate news.json
        run: |
          test -f news.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("news.json")

          with path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if data.get("success") is not True:
              raise SystemExit(
                  "ERROR: news.json success is not true."
              )

          articles = data.get(
              "articles",
              []
          )

          if not isinstance(
              articles,
              list
          ):
              raise SystemExit(
                  "ERROR: articles is not a list."
              )

          if len(articles) == 0:
              raise SystemExit(
                  "ERROR: news.json contains zero articles."
              )

          required = [
              "id",
              "title",
              "description",
              "url",
              "category",
              "mainCategory",
              "published"
          ]

          for number, article in enumerate(
              articles,
              start=1
          ):
              for field in required:
                  if field not in article:
                      raise SystemExit(
                          f"ERROR: Article {number} missing {field}"
                      )

          print("========================================")
          print("news.json validation successful")
          print("Updated:", data.get("updatedAt"))
          print("Total:", data.get("total"))
          print("Articles:", len(articles))
          print("Feeds configured:", data.get("feedsConfigured"))
          print("Feeds successful:", data.get("feedsSuccessful"))
          print("Feeds failed:", data.get("feedsFailed"))
          print("========================================")
          PY


      # =====================================================
      # SHOW NEWS SUMMARY
      # =====================================================

      - name: Show news summary
        run: |
          python - <<'PY'
          import json

          with open(
              "news.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("LATEST ARTICLES")
          print("---------------")

          for number, article in enumerate(
              data.get("articles", [])[:10],
              start=1
          ):
              print(
                  f"{number}. "
                  f"[{article.get('mainCategory')}] "
                  f"{article.get('title')}"
              )

          print("")
          PY


      # =====================================================
      # GIT STATUS
      # =====================================================

      - name: Check Git status
        run: |
          git status --short
          ls -lh news.json


      # =====================================================
      # COMMIT NEWS
      # =====================================================

      - name: Commit updated news
        run: |

          git config user.name "TechPulse News Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then

            echo "No changes detected in news.json."

          else

            git commit \
              -m "Update latest technology and gaming news"

            git push

          fi
