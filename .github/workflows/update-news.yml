name: Update Technology & Gaming News

on:

  schedule:

    - cron: "*/15 * * * *"

  workflow_dispatch:

  push:

    paths:

      - "scripts/fetch_news.py"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"


permissions:

  contents: write


jobs:

  update-news:

    runs-on: ubuntu-latest


    steps:

      # ============================================
      # 1. CHECKOUT
      # ============================================

      - name: Checkout repository

        uses: actions/checkout@v5

        with:

          fetch-depth: 0


      # ============================================
      # 2. SETUP PYTHON
      # ============================================

      - name: Setup Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"

          cache: "pip"


      # ============================================
      # 3. SHOW PYTHON VERSION
      # ============================================

      - name: Show Python version

        run: |

          python --version

          pip --version


      # ============================================
      # 4. INSTALL DEPENDENCIES
      # ============================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      # ============================================
      # 5. VERIFY DEPENDENCIES
      # ============================================

      - name: Verify Python dependencies

        run: |

          python - <<'PY'

          import feedparser
          import requests
          import bs4

          print(
              "feedparser:",
              feedparser.__version__
          )

          print(
              "requests:",
              requests.__version__
          )

          print(
              "BeautifulSoup: OK"
          )

          PY


      # ============================================
      # 6. CHECK FETCHER
      # ============================================

      - name: Check fetch script

        run: |

          if [ ! -f scripts/fetch_news.py ]; then

            echo "ERROR: scripts/fetch_news.py not found."

            exit 1

          fi


          echo "fetch_news.py found."

          ls -lh scripts/fetch_news.py


      # ============================================
      # 7. RUN NEWS FETCHER
      # ============================================

      - name: Run news fetcher

        run: |

          echo "Starting TechPulse news fetcher..."

          python -u scripts/fetch_news.py


      # ============================================
      # 8. VALIDATE NEWS JSON
      # ============================================

      - name: Validate news.json

        run: |

          if [ ! -f news.json ]; then

            echo "ERROR: news.json was not created."

            exit 1

          fi


          python - <<'PY'

          import json

          from pathlib import Path


          file_path = Path("news.json")


          with file_path.open(
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          if not isinstance(data, dict):

              raise SystemExit(
                  "news.json must contain a JSON object."
              )


          if data.get("success") is not True:

              raise SystemExit(
                  "news.json success flag is not true."
              )


          articles =
              data.get(
                  "articles",
                  []
              )


          if not isinstance(
              articles,
              list
          ):

              raise SystemExit(
                  "articles must be an array."
              )


          if len(articles) == 0:

              raise SystemExit(
                  "news.json contains zero articles."
              )


          required_fields = [

              "id",
              "title",
              "description",
              "url",
              "category",
              "mainCategory",
              "source",
              "published"

          ]


          for index, article in enumerate(
              articles
          ):

              for field in required_fields:

                  if field not in article:

                      raise SystemExit(
                          f"Article {index} "
                          f"is missing: {field}"
                      )


          print(
              "JSON validation successful."
          )


          print(
              "Updated:",
              data.get("updatedAt")
          )


          print(
              "Total:",
              data.get("total")
          )


          print(
              "Articles:",
              len(articles)
          )

          PY


      # ============================================
      # 9. SHOW NEWS STATUS
      # ============================================

      - name: Show news status

        run: |

          echo "Git status:"

          git status --short


          echo ""


          echo "News file:"

          ls -lh news.json


      # ============================================
      # 10. COMMIT NEWS
      # ============================================

      - name: Commit updated news

        run: |

          git config user.name \
            "TechPulse News Bot"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add news.json


          if git diff --cached --quiet; then

            echo "No changes detected in news.json."

          else

            git commit \
              -m "Update latest technology and gaming news"

            git push

          fi
