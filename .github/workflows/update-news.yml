name: Update Technology & Gaming News

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/fetch_news.py"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================
      # 2. SETUP PYTHON
      # ============================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # ============================================
      # 3. PYTHON VERSION
      # ============================================

      - name: Show Python version
        run: |
          python --version
          pip --version


      # ============================================
      # 4. INSTALL DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found."
            exit 1
          fi

          python -m pip install -r requirements.txt


      # ============================================
      # 5. VERIFY PYTHON MODULES
      # ============================================

      - name: Verify dependencies
        run: |
          python -c "import feedparser; import requests; import bs4; print('All dependencies are available.')"


      # ============================================
      # 6. VERIFY FETCH SCRIPT
      # ============================================

      - name: Verify fetch script
        run: |
          if [ ! -f scripts/fetch_news.py ]; then
            echo "ERROR: scripts/fetch_news.py not found."
            exit 1
          fi

          echo "fetch_news.py found."
          wc -l scripts/fetch_news.py


      # ============================================
      # 7. CHECK PYTHON SYNTAX
      # ============================================

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/fetch_news.py
          echo "Python syntax check passed."


      # ============================================
      # 8. RUN NEWS FETCHER
      # ============================================

      - name: Fetch latest news
        run: |
          echo "=========================================="
          echo "Starting TechPulse news update"
          echo "=========================================="

          python -u scripts/fetch_news.py

          echo "=========================================="
          echo "News fetch completed"
          echo "=========================================="


      # ============================================
      # 9. VERIFY NEWS.JSON EXISTS
      # ============================================

      - name: Verify news.json
        run: |
          if [ ! -f news.json ]; then
            echo "ERROR: news.json was not created."
            exit 1
          fi

          echo "news.json found."
          ls -lh news.json


      # ============================================
      # 10. VALIDATE JSON
      # ============================================

      - name: Validate news JSON
        run: |
          python -m json.tool news.json > /dev/null

          echo "JSON syntax is valid."


      # ============================================
      # 11. SHOW NEWS INFORMATION
      # ============================================

      - name: Show news statistics
        run: |
          python -c "import json; d=json.load(open('news.json', encoding='utf-8')); print('Updated:', d.get('updatedAt')); print('Total articles:', len(d.get('articles', []))); print('Success:', d.get('success'))"


      # ============================================
      # 12. SHOW GIT STATUS
      # ============================================

      - name: Show Git status
        run: |
          git status --short


      # ============================================
      # 13. COMMIT NEWS
      # ============================================

      - name: Commit updated news
        run: |
          git config user.name "TechPulse News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes detected in news.json."
          else
            git commit -m "Update latest technology and gaming news"
            git push
          fi
