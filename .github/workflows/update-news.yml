name: Update Technology & Gaming News

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  push:
    paths:
      - "fetch_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

jobs:
  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show Python version
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            echo "Installing requirements.txt"
            pip install -r requirements.txt
          else
            echo "No requirements.txt found."
          fi

      - name: Run news fetcher
        run: |
          echo "Starting fetch_news.py..."
          python -u scripts/fetch_news.py

      - name: Validate news.json
        run: |
          if [ ! -f news.json ]; then
            echo "ERROR: news.json was not created."
            exit 1
          fi

          echo "news.json found."

          python - <<'PY'
          import json

          with open("news.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("JSON validation successful.")
          print("Updated:", data.get("updatedAt"))
          print("Total:", data.get("total"))
          print("Articles:", len(data.get("articles", [])))
          PY

      - name: Show news.json status
        run: |
          git status --short
          ls -lh news.json

      - name: Commit updated news
        run: |

          git config user.name "TechPulse News Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No changes detected in news.json."
          else
            git commit -m "Update latest technology and gaming news"
            git push
          fi
