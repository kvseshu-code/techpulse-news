name: Update News

# STEP 6: automatic trigger, every 15 minutes - plus two manual escape
# hatches (workflow_dispatch button in the Actions tab, and a push to
# main so a source-list edit refreshes news.json right away).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_news.py"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"

# Needed so the workflow can commit news.json back to the repo.
permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest news
        run: python scripts/fetch_news.py

      - name: Commit news.json if it changed
        run: |
          git config user.name "techpulse-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- news.json; then
            echo "No changes to news.json - nothing to commit."
          else
            git add news.json
            git commit -m "Update news.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
