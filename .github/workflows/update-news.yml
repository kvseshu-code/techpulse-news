name: Update Technology & Gaming News

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/fetch_news.py"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. SETUP PYTHON
      # ============================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ============================================
      # 3. SHOW PYTHON VERSION
      # ============================================

      - name: Show Python version
        run: |
          python --version
          pip --version


      # ============================================
      # 4. CHECK REQUIRED FILES
      # ============================================

      - name: Check required files
        run: |
          echo "Checking repository files..."

          if [ ! -f "scripts/fetch_news.py" ]; then
            echo "ERROR: scripts/fetch_news.py not found."
            exit 1
          fi

          if [ ! -f "requirements.txt" ]; then
            echo "ERROR: requirements.txt not found."
            exit 1
          fi

          echo "Required files found."


      # ============================================
      # 5. INSTALL DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # ============================================
      # 6. VERIFY DEPENDENCIES
      # ============================================

      - name: Verify dependencies
        run: |
          python -c "import feedparser; print('feedparser:', feedparser.__version__)"
          python -c "import requests; print('requests:', requests.__version__)"
          python -c "import bs4; print('BeautifulSoup: OK')"


      # ============================================
      # 7. RUN NEWS FETCHER
      # ============================================

      - name: Fetch latest news
        run: |
          echo "============================================"
          echo "Starting TechPulse news fetcher"
          echo "============================================"

          python -u scripts/fetch_news.py

          echo ""
          echo "News fetcher completed."


      # ============================================
      # 8. CHECK NEWS JSON
      # ============================================

      - name: Check news.json
        run: |
          if [ ! -f "news.json" ]; then
            echo "ERROR: news.json was not created."
            exit 1
          fi

          echo "news.json successfully created."

          ls -lh news.json


      # ============================================
      # 9. VALIDATE JSON
      # ============================================

      - name: Validate news.json
        run: |
          python -c "
          import json

          with open('news.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise ValueError('news.json must contain a JSON object')

          articles = data.get('articles', [])

          if not isinstance(articles, list):
              raise ValueError('articles must be an array')

          print('JSON validation successful')
          print('Updated:', data.get('updatedAt'))
          print('Total:', data.get('total'))
          print('Articles:', len(articles))
          "


      # ============================================
      # 10. DISPLAY FIRST ARTICLES
      # ============================================

      - name: Show news summary
        run: |
          python -c "
          import json

          with open('news.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          articles = data.get('articles', [])

          print('')
          print('============================================')
          print('TECHPULSE NEWS SUMMARY')
          print('============================================')
          print('Total articles:', len(articles))
          print('Updated:', data.get('updatedAt'))
          print('')

          for i, article in enumerate(articles[:10], 1):
              print(f'{i}. {article.get(\"title\", \"Untitled\")}')
              print(f'   Category: {article.get(\"category\", \"Unknown\")}')
              print(f'   Source: {article.get(\"source\", \"Unknown\")}')
              print('')
          "


      # ============================================
      # 11. CHECK GIT CHANGES
      # ============================================

      - name: Check Git changes
        run: |
          git status --short


      # ============================================
      # 12. COMMIT NEWS
      # ============================================

      - name: Commit updated news
        run: |

          git config user.name "TechPulse News Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then

            echo "No changes detected in news.json."

          else

            echo "New news detected."

            git commit \
              -m "Update latest technology and gaming news"

            git push

          fi
