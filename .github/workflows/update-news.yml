name: Update TechPulse dataset
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Build dataset
        run: python fetch_news.py
      - name: Validate JSON
        run: python -m json.tool news.json >/dev/null
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'chore: update TechPulse dataset'; git push; fi
